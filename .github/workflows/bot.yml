name: ONYX bot 24/7

on:
  schedule:
    - cron: "*/5 * * * *"   # cada 5 minutos (GitHub puede retrasarlo un poco)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["config/**", "engine/**"]

permissions:
  contents: write
  actions: write   # para programar el siguiente ciclo

concurrency:
  group: onyx-engine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Hora de inicio
        run: echo "START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --no-audit --no-fund

      # Claves privadas de las notificaciones (se generan solas la primera vez)
      - uses: actions/cache@v4
        with:
          path: .vapid
          key: onyx-vapid-v1

      - name: Recuperar estado anterior
        run: |
          mkdir -p data
          git fetch --depth=1 origin data 2>/dev/null && git show FETCH_HEAD:state.json > data/state.json || echo "Primer arranque: sin estado previo"

      - name: Ejecutar motor
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: node engine/run.js

      - name: Publicar estado en la rama data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/out && cp data/state.json /tmp/out/state.json
          cd /tmp/out
          git init -q -b data
          git -c user.name="onyx-bot" -c user.email="onyx-bot@users.noreply.github.com" add state.json
          git -c user.name="onyx-bot" -c user.email="onyx-bot@users.noreply.github.com" commit -qm "estado $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      # El cron de GitHub se retrasa o se salta ciclos. Para que sea 24/7 de verdad,
      # cada ciclo programa el siguiente ~5 min después de haber empezado.
      # Si hay varios encadenados, el grupo de concurrencia los reduce a uno.
      - name: Programar el siguiente ciclo
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ELAPSED=$(( $(date +%s) - START ))
          WAIT=$(( 270 - ELAPSED ))
          if [ "$WAIT" -gt 0 ]; then sleep "$WAIT"; fi
          gh workflow run bot.yml --repo "$GITHUB_REPOSITORY" --ref main
