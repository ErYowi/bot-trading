<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ONYX</title>
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ONYX" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand" aria-label="ONYX">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 2 21 7v10l-9 5-9-5V7z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6.5 14.5 10 11l2.5 2.5L17.5 8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>ONYX</span>
      </div>
      <div class="top-actions">
        <button class="heartbeat" id="heartbeat" type="button" aria-live="polite">
          <span class="pulse" aria-hidden="true"></span><span id="heartbeat-text">Conectando…</span>
        </button>
        <button class="help" type="button" data-action="guide" aria-label="Guía de esta pantalla">?</button>
      </div>
    </header>

    <main id="view" tabindex="-1"></main>

    <nav class="tabbar" aria-label="Secciones">
      <a href="#inicio" data-tab="inicio"><svg viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5V20H4z"/></svg><span>Inicio</span></a>
      <a href="#bots" data-tab="bots"><svg viewBox="0 0 24 24"><rect x="5" y="8" width="14" height="11" rx="3"/><path d="M12 8V5M9 13h.01M15 13h.01M9.5 16.5h5"/></svg><span>Bots</span></a>
      <a href="#mercado" data-tab="mercado"><svg viewBox="0 0 24 24"><path d="M4 17l5-5 4 3 7-8M15 7h5v5"/></svg><span>Mercado</span></a>
      <a href="#diario" data-tab="diario"><svg viewBox="0 0 24 24"><path d="M6 4h10l2 2v14H6zM9 9h6M9 13h6M9 17h3"/></svg><span>Diario</span></a>
      <a href="#ajustes" data-tab="ajustes"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg><span>Ajustes</span></a>
    </nav>
  </div>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-grip" aria-hidden="true"></div>
      <div id="sheet-body"></div>
    </div>
  </div>
  <div id="toasts" aria-live="polite"></div>

  <script src="guide.js"></script>
  <script src="charts.js"></script>
  <script src="github.js"></script>
  <script src="app.js"></script>
</body>
</html>
